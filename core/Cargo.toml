[package]
name = "bili-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local data service for bili-mini (bilibili API wrapper)"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde_json = "1"
getrandom = "0.3"
bpi-rs = "0.3"
anyhow = "1"
cookie-scoop = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
flate2 = "1"
quick-xml = "0.42"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
